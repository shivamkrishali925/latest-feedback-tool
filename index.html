<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f8fc">
<title>Faculty Feedback Sheet Dashboard</title>
<link rel="icon" type="image/svg+xml" href="FacultyFeedbackSheetDashboard-icon.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #f5f8fc;
    --surface: #ffffff;
    --card: #ffffff;
    --card-soft: #edf3fb;
    --border: #d7e1ee;
    --accent1: #d86d2f;
    --accent2: #0e7a86;
    --accent3: #7357cc;
    --text: #132033;
    --muted: #5f6b7d;
    --danger: #c63d55;
    --good: #0f8a61;
    --warn: #d97706;
    --bg-glow-1: rgba(100, 142, 214, 0.15);
    --bg-glow-2: rgba(232, 168, 124, 0.16);
    --bg-glow-3: rgba(115, 87, 204, 0.10);
    --surface-hint: rgba(15, 32, 51, 0.03);
    --track: rgba(15, 32, 51, 0.08);
    --chart-grid: rgba(15, 32, 51, 0.08);
    --tooltip-bg: #ffffff;
    --tooltip-text: #132033;
    --tooltip-muted: #5f6b7d;
    --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
  }

  body[data-theme='dark'] {
    color-scheme: dark;
    --bg: #0f0f13;
    --surface: #17171f;
    --card: #1e1e2a;
    --card-soft: #242433;
    --border: #2a2a3a;
    --accent1: #e8a87c;
    --accent2: #7ec8c8;
    --accent3: #b484e8;
    --text: #f0eeea;
    --muted: #8a8a9a;
    --danger: #e87c7c;
    --good: #7ce8a8;
    --warn: #f59e0b;
    --bg-glow-1: rgba(232, 168, 124, 0.12);
    --bg-glow-2: rgba(126, 200, 200, 0.10);
    --bg-glow-3: rgba(180, 132, 232, 0.08);
    --surface-hint: rgba(255, 255, 255, 0.03);
    --track: rgba(255, 255, 255, 0.08);
    --chart-grid: rgba(255, 255, 255, 0.06);
    --tooltip-bg: #1e1e2a;
    --tooltip-text: #f0eeea;
    --tooltip-muted: #8a8a9a;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(circle at top left, var(--bg-glow-1), transparent 28rem),
      radial-gradient(circle at 80% 15%, var(--bg-glow-2), transparent 24rem),
      radial-gradient(circle at 50% 85%, var(--bg-glow-3), transparent 22rem),
      var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctave[...]
    pointer-events: none;
    z-index: 0;
    opacity: 0.28;
  }

  body[data-theme='dark']::before {
    opacity: 0.55;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1360px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto;
  }

  .header-left .badge {
    display: inline-block;
    background: rgba(232,168,124,0.12);
    color: var(--accent1);
    border: 1px solid rgba(232,168,124,0.25);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(30px, 4vw, 46px);
    font-weight: 900;
    letter-spacing: -0.8px;
    line-height: 1.04;
  }

  .header-left p {
    color: var(--muted);
    margin-top: 8px;
    font-size: 13px;
    max-width: 760px;
  }

  .rating-legend {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .rating-item {
    font-size: 10px;
    color: var(--muted);
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
  }

  .rating-item.score-low {
    background: rgba(198, 61, 85, 0.12);
    color: var(--danger);
    border-color: rgba(198, 61, 85, 0.25);
  }

  .rating-item.score-mid {
    background: rgba(245, 158, 11, 0.12);
    color: var(--warn);
    border-color: rgba(245, 158, 11, 0.25);
  }

  .rating-item.score-high {
    background: rgba(15, 138, 97, 0.12);
    color: var(--good);
    border-color: rgba(15, 138, 97, 0.25);
  }

  .source-panel,
  .mapping-panel,
  .filter-panel,
  .empty-state {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
  }

  .source-panel {
    display: grid;
    gap: 14px;
  }

  .source-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .source-row input {
    flex: 1;
    min-width: min(100%, 360px);
  }

  input,
  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }

  select {
    width: 100%;
  }

  input:focus,
  select:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(126,200,200,0.08);
  }

  button {
    background: var(--card-soft);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    transition: transform 0.16s, border-color 0.16s, color 0.16s, background 0.16s;
  }

  button:hover {
    transform: translateY(-1px);
    border-color: var(--accent2);
    color: var(--accent2);
  }

  button.primary {
    background: rgba(126,200,200,0.13);
    border-color: rgba(126,200,200,0.36);
    color: var(--accent2);
  }

  button.secondary {
    background: rgba(232,168,124,0.10);
    border-color: rgba(232,168,124,0.30);
    color: var(--accent1);
  }

  button.danger {
    background: rgba(232,124,124,0.10);
    border-color: rgba(232,124,124,0.30);
    color: var(--danger);
  }

  button:disabled {
    cursor: not-allowed;
    opacity: 0.48;
    transform: none;
  }

  .theme-toggle {
    min-width: 126px;
  }

  .status {
    display: none;
    border-radius: 8px;
    padding: 11px 13px;
    font-size: 13px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: rgba(255,255,255,0.03);
  }

  .status.show { display: block; }
  .status.ok { border-color: rgba(124,232,168,0.28); color: var(--good); background: rgba(124,232,168,0.06); }
  .status.error { border-color: rgba(232,124,124,0.32); color: var(--danger); background: rgba(232,124,124,0.07); }
  .status.loading { border-color: rgba(232,208,124,0.32); color: var(--warn); background: rgba(232,208,124,0.07); }

  .helper-text {
    color: var(--muted);
    font-size: 12px;
  }

  .mapping-panel[hidden],
  .filter-panel[hidden],
  .dashboard-shell[hidden],
  .empty-state[hidden] {
    display: none;
  }

  .mapping-panel summary {
    cursor: pointer;
    color: var(--accent1);
    font-weight: 800;
    letter-spacing: 0.3px;
  }

  .mapping-summary {
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    margin-left: 8px;
  }

  .mapping-grid,
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }

  .field label,
  .filter-field label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .rating-column-box {
    margin-top: 16px;
  }

  .rating-column-box .rating-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .rating-checks {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 8px;
    max-height: 230px;
    overflow: auto;
    padding-right: 4px;
  }

  .rating-check {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    border: 1px solid var(--border);
    background: var(--surface-hint);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 12px;
  }

  .rating-check input {
    width: auto;
    margin-top: 3px;
    accent-color: var(--accent2);
  }

  .panel-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .filter-panel {
    display: grid;
    gap: 12px;
  }

  .filter-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-title {
    color: var(--accent2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    font-weight: 800;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
  }

  .stat-card.accent1::before { background: var(--accent1); }
  .stat-card.accent2::before { background: var(--accent2); }
  .stat-card.accent3::before { background: var(--accent3); }
  .stat-card.danger::before { background: var(--danger); }
  .stat-card.good::before { background: var(--good); }
  .stat-card.warn::before { background: var(--warn); }

  .stat-label {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    margin: 4px 0 2px;
  }

  .stat-sub {
    color: var(--muted);
    font-size: 11px;
  }

  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .tab-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 700;
    transition: all 0.15s;
  }

  .tab-btn:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.22);
  }

  .tab-btn.active {
    background: var(--surface);
    color: var(--accent1);
    border-color: var(--accent1);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 18px;
  }

  .charts-grid.full { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

  .span-2 {
    grid-column: 1 / -1;
  }

  .overview-grid,
  .comparison-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-bottom: 18px;
  }

  .overview-card,
  .analysis-card,
  .comparison-panel,
  .heatmap-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: var(--shadow);
    min-width: 0;
  }

  .overview-card {
    display: grid;
    gap: 14px;
  }

  .overview-card h3,
  .analysis-card h3,
  .comparison-panel h3,
  .heatmap-panel h3 {
    font-size: 13px;
    font-weight: 800;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .overview-card h3 span,
  .analysis-card h3 span,
  .comparison-panel h3 span,
  .heatmap-panel h3 span {
    color: var(--text);
    font-size: 16px;
    font-weight: 800;
    text-transform: none;
    letter-spacing: 0;
    display: block;
    margin-top: 2px;
  }

  .overview-list,
  .analysis-list {
    display: grid;
    gap: 10px;
  }

  .overview-item,
  .analysis-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-hint);
  }

  .overview-item .label,
  .analysis-item .label {
    color: var(--text);
    font-weight: 700;
    line-height: 1.35;
  }

  .overview-item .meta,
  .analysis-item .meta {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
  }

  .analysis-summary {
    color: var(--muted);
    font-size: 12px;
    margin-top: -4px;
  }

  .comparison-controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 14px;
    margin-bottom: 18px;
  }

  .comparison-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .comparison-note {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }

  .heatmap-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 680px;
  }

  .heatmap-table th {
    text-align: left;
    padding: 8px 10px;
    color: var(--muted);
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }

  .heatmap-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  .heatmap-table tr:last-child td {
    border-bottom: none;
  }

  .heatmap-table tr:hover td {
    background: var(--surface-hint);
  }

  .heatmap-cell {
    text-align: center;
    font-weight: 800;
    border-radius: 8px;
  }

  .heatmap-cell.score-high {
    background: rgba(15, 138, 97, 0.12);
  }

  .heatmap-cell.score-mid {
    background: rgba(245, 158, 11, 0.12);
  }

  .heatmap-cell.score-low {
    background: rgba(198, 61, 85, 0.12);
  }

  .heatmap-cell.score-none {
    background: var(--surface-hint);
  }

  .heatmap-legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .heatmap-chip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface-hint);
  }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 1fr; }
    .charts-grid.full { grid-template-columns: 1fr; }
    .overview-grid,
    .comparison-grid { grid-template-columns: 1fr; }
    .source-row { flex-direction: column; }
    .source-row button { width: 100%; }
    .header-actions { width: 100%; margin-left: 0; }
    .theme-toggle { width: 100%; }
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    animation: fadeUp 0.5s ease both;
    min-width: 0;
    box-shadow: var(--shadow);
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }

  .card-title span {
    color: var(--text);
    font-size: 16px;
    font-weight: 800;
    text-transform: none;
    letter-spacing: 0;
    display: block;
    margin-top: 2px;
  }

  .chart-wrap {
    position: relative;
  }

  .chart-wrap canvas {
    display: block;
  }

  .scale-note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    text-align: right;
  }

  .table-wrap {
    overflow-x: auto;
  }

  .compare-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    min-width: 680px;
  }

  .compare-table th {
    text-align: left;
    padding: 8px 12px;
    color: var(--muted);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
  }

  .compare-table td {
    padding: 9px 12px;
    border-bottom: 1px solid rgba(42,42,58,0.5);
    vertical-align: middle;
  }

  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:hover td { background: var(--surface-hint); }

  .bar-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--track);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 3px;
  }

  .score-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 800;
    font-size: 12px;
    white-space: nowrap;
  }

  .score-low { background: rgba(232,124,124,0.15); color: var(--danger); }
  .score-mid { background: rgba(245,158,11,0.15); color: var(--warn); }
  .score-high { background: rgba(124,232,168,0.15); color: var(--good); }
  .score-none { background: var(--card-soft); color: var(--muted); }

  .suggestions-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .suggestions-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 560px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .suggestion-item {
    background: var(--surface-hint);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 15px;
    color: var(--text);
    border-left: 3px solid var(--accent3);
    line-height: 1.5;
  }

  .suggestion-rating {
    color: var(--muted);
    font-size: 12px;
    margin-top: 8px;
  }

  .suggestion-meta {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .suggestion-meta .tag {
    background: rgba(180,132,232,0.1);
    color: var(--accent3);
    border-radius: 3px;
    padding: 1px 6px;
  }

  .suggestion-meta .tag.score-low {
    background: rgba(232,124,124,0.15);
    color: var(--danger);
  }

  .suggestion-meta .tag.score-mid {
    background: rgba(245,158,11,0.15);
    color: var(--warn);
  }

  .suggestion-meta .tag.score-high {
    background: rgba(124,232,168,0.15);
    color: var(--good);
  }

  .suggestion-meta .tag.score-none {
    background: var(--card-soft);
    color: var(--muted);
  }

  .suggestion-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .insight-box {
    background: rgba(232,168,124,0.06);
    border: 1px solid rgba(232,168,124,0.2);
    border-radius: 8px;
    padding: 14px 18px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
    margin-top: 14px;
  }
